name: Finalize 1.1.3 publication temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-1.1.3-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final documentation and validated release package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-92cc-820e-8b63-26cc05b7b6d5/raw?se=2026-09-05T16%3A23%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=6a68c8fc-1a75-51a8-a925-02e3168ad868&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T11%3A11%3A30Z&ske=2026-09-06T11%3A11%3A30Z&sks=b&skv=2026-02-06&sig=MbwZdEApgYa65ErYn8ufbBTUBO6u/2LvjLdnie/lLnE%3D' -o /tmp/public-docs.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-bae0-820e-8e7c-c0df08a5fb2d/raw?se=2026-09-05T16%3A21%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=b85b1bf0-93cf-573e-91af-1980222a2b0a&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T10%3A56%3A25Z&ske=2026-09-06T10%3A56%3A25Z&sks=b&skv=2026-02-06&sig=6i3SmFtBW2TAdAex7Eyhvc8CjpI5O69ClJFxBhKcDjM%3D' -o /tmp/release-artifact.zip

      - name: Install 1.1.3 Word documentation in public repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/public-docs
          mkdir -p /tmp/public-docs
          unzip -q /tmp/public-docs.zip -d /tmp/public-docs
          cp /tmp/public-docs/*.docx docs/
          rm -f docs/SqlWorkflowMonitor_Manual_de_Instalacion_y_Uso_ES_1.1.2.docx
          rm -f docs/SqlWorkflowMonitor_Installation_and_User_Guide_EN_1.1.2.docx
          rm -f docs/SqlWorkflowMonitor_Descripcion_Comercial_ES_1.1.2.docx
          rm -f docs/SqlWorkflowMonitor_Product_Overview_EN_1.1.2.docx
          test -f docs/SqlWorkflowMonitor_Manual_de_Instalacion_y_Uso_ES_1.1.3.docx
          test -f docs/SqlWorkflowMonitor_Installation_and_User_Guide_EN_1.1.3.docx
          test -f docs/SqlWorkflowMonitor_Descripcion_Comercial_ES_1.1.3.docx
          test -f docs/SqlWorkflowMonitor_Product_Overview_EN_1.1.3.docx

      - name: Verify validated release package checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-files
          mkdir -p /tmp/release-files
          unzip -q /tmp/release-artifact.zip -d /tmp/release-files
          cd /tmp/release-files
          test -f SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip
          test -f SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip.sha256.txt
          sha256sum -c SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip.sha256.txt

      - name: Commit final public 1.1.3 repository state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Federico Stimpfl"
          git config user.email "contacto@federicostimpfl.com.ar"
          git rm .github/workflows/finalize-1.1.3-temp.yml
          git add docs
          git commit -m "release: prepare Workflow Monitor 1.1.3 public distribution"
          git push origin main

      - name: Upload release assets and publish v1.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/release-files
          gh release upload v1.1.3 \
            SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip \
            SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip.sha256.txt \
            --clobber
          gh release edit v1.1.3 --target main --draft=false --latest
