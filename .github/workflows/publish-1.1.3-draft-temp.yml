name: Prepare 1.1.3 draft release temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.1.3-draft-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.3 >/dev/null 2>&1; then
            echo "v1.1.3 already exists; leaving it unchanged."
          else
            cat > release-notes-1.1.3.md <<'EOF'
          # Workflow Monitor 1.1.3

          Workflow Monitor 1.1.3 is the current Windows x64 Demo release for SQL-backed workflow execution monitoring.

          ## Changes

          - Corrected Spanish CSV export for reliable opening in Excel while preserving accented text.
          - Confirmed installer product/display version as 1.1.3.
          - Finalized the validated Windows installer/uninstaller and packaging hardening.
          - Updated Microsoft Defender SmartScreen guidance for the current unsigned Authenticode distribution.
          - Refreshed public screenshots, walkthrough and formal documentation.

          ## Demo

          - 30-day evaluation
          - Up to 3 registered processes
          - 1 Worker/integration
          - Dashboard and REST API
          - CSV export
          - Spanish / English interface
          - Read-only mode after expiration

          ## Requirements

          - Windows x64
          - Local or reachable SQL Server instance
          - Administrator permissions during installation

          ## Integrity

          Verify the Demo ZIP against the SHA-256 checksum published with this release before running the installer.
          EOF
            gh release create v1.1.3 --draft --target main --title "Workflow Monitor 1.1.3" --notes-file release-notes-1.1.3.md
          fi

      - name: Clean temporary publication branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            release/1.1.3-publication-temp \
            release/1.1.3-publication-temp2 \
            release/1.1.3-publication-temp3 \
            release/1.1.3-publication-temp4; do
            git push origin --delete "$branch" 2>/dev/null || true
          done

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Federico Stimpfl"
          git config user.email "contacto@federicostimpfl.com.ar"
          git rm .github/workflows/publish-1.1.3-draft-temp.yml
          git commit -m "chore: remove temporary 1.1.3 draft workflow"
          git push origin main
