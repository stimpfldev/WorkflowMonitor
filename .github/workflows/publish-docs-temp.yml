name: Publish current Word documentation

on:
  push:
    paths:
      - .github/workflows/publish-docs-temp.yml

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install document tooling
        run: python -m pip install --disable-pip-version-check python-docx pillow

      - name: Generate public Word documentation
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build_docs.py" <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from PIL import Image, ImageDraw

          ROOT = Path.cwd()
          DOCS = ROOT / 'docs'
          DOCS.mkdir(exist_ok=True)
          logo = Path('/tmp/workflow-monitor-mark.png')

          img = Image.new('RGBA', (256, 256), (255,255,255,0))
          d = ImageDraw.Draw(img)
          bars = [(32,40,80,216,'#58B8F8'), (104,40,152,216,'#1463F3'), (176,40,224,216,'#0B2C64')]
          for x1,y1,x2,y2,c in bars:
              d.rounded_rectangle((x1,y1,x2,y2), radius=24, fill=c)
          img.save(logo)

          BLUE = RGBColor(20, 99, 243)
          NAVY = RGBColor(11, 44, 100)
          GRAY = RGBColor(90, 90, 90)

          def shade(cell, fill):
              tcPr = cell._tc.get_or_add_tcPr()
              shd = OxmlElement('w:shd')
              shd.set(qn('w:fill'), fill)
              tcPr.append(shd)

          def base_doc(title, subtitle, version_line, lang):
              doc = Document()
              sec = doc.sections[0]
              sec.top_margin = Inches(0.65)
              sec.bottom_margin = Inches(0.65)
              sec.left_margin = Inches(0.75)
              sec.right_margin = Inches(0.75)
              props = doc.core_properties
              props.author = ''
              props.last_modified_by = ''
              props.title = title
              props.subject = 'Workflow Monitor 1.1.2 public documentation'
              props.keywords = 'Workflow Monitor, SQL Server, .NET, backend monitoring'

              normal = doc.styles['Normal']
              normal.font.name = 'Aptos'
              normal.font.size = Pt(10.5)
              normal.paragraph_format.space_after = Pt(6)
              for s in ['Heading 1', 'Heading 2']:
                  st = doc.styles[s]
                  st.font.name = 'Aptos Display'
                  st.font.color.rgb = NAVY
              doc.styles['Heading 1'].font.size = Pt(16)
              doc.styles['Heading 1'].paragraph_format.space_before = Pt(13)
              doc.styles['Heading 1'].paragraph_format.space_after = Pt(5)

              p = doc.add_paragraph()
              p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              p.add_run().add_picture(str(logo), width=Inches(0.62))
              p = doc.add_paragraph()
              p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              r = p.add_run(title)
              r.bold = True; r.font.size = Pt(24); r.font.color.rgb = NAVY
              p = doc.add_paragraph()
              p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              r = p.add_run(subtitle)
              r.font.size = Pt(14); r.font.color.rgb = BLUE
              p = doc.add_paragraph()
              p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              r = p.add_run(version_line)
              r.font.size = Pt(9.5); r.font.color.rgb = GRAY

              footer = sec.footer.paragraphs[0]
              footer.alignment = WD_ALIGN_PARAGRAPH.CENTER
              rr = footer.add_run('Workflow Monitor 1.1.2  |  github.com/stimpfldev/WorkflowMonitor  |  federicostimpfl.com.ar')
              rr.font.size = Pt(8); rr.font.color.rgb = GRAY
              return doc

          def add_bullets(doc, items):
              for x in items:
                  doc.add_paragraph(x, style='List Bullet')

          def add_numbers(doc, items):
              for x in items:
                  doc.add_paragraph(x, style='List Number')

          def add_table(doc, rows):
              t = doc.add_table(rows=1, cols=2)
              t.alignment = WD_TABLE_ALIGNMENT.CENTER
              t.style = 'Table Grid'
              h = t.rows[0].cells
              h[0].text, h[1].text = rows[0]
              for c in h:
                  shade(c, '0B2C64')
                  c.vertical_alignment = WD_CELL_VERTICAL_ALIGNMENT.CENTER
                  for run in c.paragraphs[0].runs:
                      run.font.color.rgb = RGBColor(255,255,255); run.bold = True
              for a,b in rows[1:]:
                  c = t.add_row().cells
                  c[0].text, c[1].text = a,b
              doc.add_paragraph()

          def save(doc, name):
              path = DOCS / name
              doc.save(path)
              return path

          # Spanish manual
          d = base_doc('Workflow Monitor', 'Manual de instalación y uso', 'Versión 1.1.2 · Septiembre de 2026', 'es')
          add_table(d, [('Item','Value'),('Producto','Workflow Monitor'),('Nombre técnico de la solución','SqlWorkflowMonitor'),('Versión','1.1.2'),('Plataforma','Windows x64'),('Runtime','.NET 10 self-contained'),('Base de datos','SQL Server'),('Arquitectura','Web/API + Worker Service + SQL Server')])
          sections = [
            ('1. Alcance del producto', ['Workflow Monitor registra, monitorea y permite revisar ejecuciones de procesos backend y workflows respaldados por SQL. El paquete para Windows ejecuta un servicio Web/API y un Worker y almacena la información operativa en SQL Server.']),
            ('2. Edición Demo', ['Evaluación técnica por 30 días.','Hasta 3 procesos registrados.','1 Worker/integración.','Dashboard real, API REST y procesamiento real.','Acceso de solo lectura a la información registrada después del vencimiento.','Interfaz en español e inglés.']),
            ('3. Requisitos', ['Windows x64.','Una instancia de SQL Server local o accesible.','El usuario de Windows que instala debe poder crear la base SqlWorkflowMonitor.','Permisos de Administrador para instalar servicios de Windows.','Un navegador moderno.','La Demo empaquetada no requiere instalar .NET por separado.']),
          ]
          for title, paras in sections:
              d.add_heading(title,1)
              if title in ('2. Edición Demo','3. Requisitos'): add_bullets(d, paras)
              else:
                  for x in paras: d.add_paragraph(x)
          d.add_heading('4. Instalación',1)
          add_numbers(d, ['Descargue el ZIP de la Demo y su checksum SHA-256 desde la Release oficial de Workflow Monitor en GitHub.','Verifique el checksum cuando sea posible.','Extraiga todo el ZIP en una carpeta local temporal.','Ejecute WorkflowMonitorSetup.exe.','Indique la instancia de SQL Server. Use . para la instancia local predeterminada.','El usuario administrador es admin. Defina y repita una contraseña de al menos 12 caracteres.','Presione Instalar y acepte el permiso de Administrador de Windows.','Espere a que finalicen todas las etapas de instalación.','Deje marcada la opción “Abrir Workflow Monitor ahora” y presione Finalizar.'])
          d.add_paragraph(r'Ubicación de instalación: C:\Program Files\Workflow Monitor')
          d.add_paragraph('URL local de acceso: http://127.0.0.1:5080/account/login')
          d.add_heading('5. Componentes instalados',1); add_bullets(d,['Servicio de Windows: SqlWorkflowMonitor Web.','Servicio de Windows: SqlWorkflowMonitor Worker.','Base SQL Server: SqlWorkflowMonitor.',r'Raíz de datos operativos: C:\SqlWorkflowMonitor\Data.','Identidad visual actual y desinstalador gráfico.'])
          d.add_heading('6. Procesamiento de ejemplo',1); d.add_paragraph(r'El instalador crea un archivo reutilizable en C:\SqlWorkflowMonitor\Data\Samples\customers.csv. Cópielo a C:\SqlWorkflowMonitor\Data\Input\customers.csv para ejecutar el ejemplo.'); d.add_paragraph('El Worker de la Demo revisa la carpeta de entrada cada 60 segundos, por lo que la detección puede demorar hasta aproximadamente un minuto. El procesamiento comienza inmediatamente después de detectar el archivo.'); add_table(d,[('Item','Value'),('Proceso','Importación de clientes'),('Total','3'),('Correctos','2'),('Incorrectos','1'),('Filas afectadas','2')])
          d.add_heading('7. Dashboard y datos de ejecución',1); add_bullets(d,['Estado e historial de ejecuciones.','Inicio, finalización y duración.','Totales de procesamiento y filas afectadas.','Información de errores.','Filtros, ordenamiento, paginación y exportación CSV.','Detección de ejecuciones demoradas.'])
          d.add_heading('8. Seguridad y configuración local',1); d.add_paragraph('Durante la instalación se genera una API key aleatoria y el hash/salt PBKDF2-SHA-256 de la contraseña del administrador. Las plantillas del paquete no contienen contraseñas reales, API keys reales, claves privadas de firma ni licencias de clientes.'); d.add_paragraph('La configuración Web predeterminada escucha solamente en loopback. Cualquier exposición remota requiere HTTPS controlado y restricciones de red adecuadas.')
          d.add_heading('9. Desinstalación',1); add_numbers(d,[r'Abra Aplicaciones instaladas de Windows y seleccione Workflow Monitor Demo, o ejecute C:\Program Files\Workflow Monitor\WorkflowMonitorUninstall.exe.','Confirme la instancia de SQL Server mostrada por el desinstalador.','Elija si desea conservar o eliminar la base SqlWorkflowMonitor.','Complete la desinstalación. Se eliminan los servicios Web y Worker y los archivos instalados.'])
          d.add_heading('10. SmartScreen e integridad del paquete',1); d.add_paragraph('La versión 1.1.2 se distribuye sin una firma Authenticode de editor confiable, por lo que Microsoft Defender SmartScreen puede mostrar una advertencia de “aplicación no reconocida”. Es un tema de firma/reputación de distribución, no un error funcional de la aplicación. Use únicamente el asset oficial y verifique su checksum SHA-256.')
          d.add_heading('11. Ediciones comerciales',1); d.add_paragraph('Professional y Enterprise utilizan el mismo núcleo de monitoreo con límites licenciados y configuración orientada a producción. Los paquetes comerciales se distribuyen por separado con licencias firmadas específicas para cada cliente.')
          d.add_heading('12. Soporte y diagnóstico seguro',1); d.add_paragraph('Al reportar un problema, elimine contraseñas, API keys, credenciales de cadenas de conexión, datos de clientes, identificadores de producción y logs sensibles. Incluya únicamente información sanitizada para reproducir el problema.')
          save(d,'SqlWorkflowMonitor_Manual_de_Instalacion_y_Uso_ES_1.1.2.docx')

          # English guide
          d = base_doc('Workflow Monitor', 'Installation and User Guide', 'Version 1.1.2 · September 2026', 'en')
          add_table(d,[('Item','Value'),('Product','Workflow Monitor'),('Technical solution name','SqlWorkflowMonitor'),('Version','1.1.2'),('Platform','Windows x64'),('Runtime','Self-contained .NET 10'),('Database','SQL Server'),('Architecture','Web/API + Worker Service + SQL Server')])
          d.add_heading('1. Product scope',1); d.add_paragraph('Workflow Monitor records, monitors and reviews executions of backend processes and SQL-backed workflows. The Windows package runs a Web/API service and a Worker service and stores operational data in SQL Server.')
          d.add_heading('2. Demo edition',1); add_bullets(d,['30-day technical evaluation.','Up to 3 registered processes.','1 Worker/integration.','Real dashboard, REST API and workflow processing.','Read-only access to recorded information after expiration.','Spanish and English interface.'])
          d.add_heading('3. Requirements',1); add_bullets(d,['Windows x64.','A local or reachable SQL Server instance.','The installing Windows account must be able to create the SqlWorkflowMonitor database.','Administrator permissions to install Windows services.','A modern web browser.','No separate .NET runtime installation is required for the packaged Demo.'])
          d.add_heading('4. Installation',1); add_numbers(d,['Download the Demo ZIP and its SHA-256 checksum from the official Workflow Monitor GitHub Release.','Verify the checksum when possible.','Extract the complete ZIP to a local temporary folder.','Run WorkflowMonitorSetup.exe.','Enter the SQL Server instance. Use . for the default local instance.','The administrator username is admin. Define and repeat a password of at least 12 characters.','Select Install and approve the Windows administrator prompt.','Wait until all installation stages complete.','Keep “Open Workflow Monitor now” selected and choose Finish.'])
          d.add_paragraph(r'Installation location: C:\Program Files\Workflow Monitor'); d.add_paragraph('Local login URL: http://127.0.0.1:5080/account/login')
          d.add_heading('5. Installed components',1); add_bullets(d,['Windows service: SqlWorkflowMonitor Web.','Windows service: SqlWorkflowMonitor Worker.','SQL Server database: SqlWorkflowMonitor.',r'Operational data root: C:\SqlWorkflowMonitor\Data.','Current brand assets and graphical uninstall launcher.'])
          d.add_heading('6. Sample processing',1); d.add_paragraph(r'The installer creates a reusable sample at C:\SqlWorkflowMonitor\Data\Samples\customers.csv. Copy it to C:\SqlWorkflowMonitor\Data\Input\customers.csv to run the example.'); d.add_paragraph('The Demo Worker checks the input folder every 60 seconds, so detection may take up to approximately one minute. Processing begins immediately after detection.'); add_table(d,[('Item','Value'),('Process','Importación de clientes'),('Total','3'),('Correct','2'),('Incorrect','1'),('Affected rows','2')])
          d.add_heading('7. Dashboard and execution data',1); add_bullets(d,['Execution status and history.','Start, completion and duration information.','Processing totals and affected rows.','Failure information.','Filtering, sorting, pagination and CSV export.','Stale execution detection.'])
          d.add_heading('8. Security and local configuration',1); d.add_paragraph('The installer generates a random API key and a PBKDF2-SHA-256 administrator password hash/salt at installation time. No real password, API key, private signing key or customer license is embedded in the package source templates.'); d.add_paragraph('The default Web binding is loopback-only. Remote exposure requires a controlled HTTPS deployment and appropriate network restrictions.')
          d.add_heading('9. Uninstallation',1); add_numbers(d,[r'Open Windows Installed apps and select Workflow Monitor Demo, or run C:\Program Files\Workflow Monitor\WorkflowMonitorUninstall.exe.','Confirm the SQL Server instance shown by the uninstaller.','Choose whether to preserve or remove the SqlWorkflowMonitor database.','Complete the uninstall. The Web and Worker services and installed application files are removed.'])
          d.add_heading('10. SmartScreen and package integrity',1); d.add_paragraph('Version 1.1.2 is distributed without a trusted Authenticode publisher signature, so Microsoft Defender SmartScreen can display an “unrecognized app” warning. This is a distribution-signing/reputation issue, not an application runtime error. Use only the official Release asset and verify its SHA-256 checksum.')
          d.add_heading('11. Commercial editions',1); d.add_paragraph('Professional and Enterprise packages use the same monitoring core with licensed limits and production-oriented configuration. Commercial packages are distributed separately with customer-specific signed license files.')
          d.add_heading('12. Support and safe diagnostics',1); d.add_paragraph('When reporting a problem, remove passwords, API keys, connection-string credentials, customer data, production identifiers and sensitive logs. Include only sanitized reproduction details.')
          save(d,'SqlWorkflowMonitor_Installation_and_User_Guide_EN_1.1.2.docx')

          # Spanish commercial overview
          d = base_doc('Workflow Monitor','Descripción del producto','Versión 1.1.2 · Septiembre de 2026','es')
          d.add_heading('Visibilidad operativa para procesos backend',1); d.add_paragraph('Workflow Monitor es una aplicación Windows on-premises para registrar y revisar el ciclo de vida de procesos backend .NET, Worker Services, importaciones, procesos batch y workflows respaldados por SQL desde un dashboard web autenticado.')
          d.add_heading('Capacidades principales',1); add_bullets(d,['API REST para el ciclo de ejecución.','Dashboard Web autenticado.','Persistencia en SQL Server.','Integración con Worker Service.','Totales de procesamiento, métricas de éxito/error y filas afectadas.','Filtros, ordenamiento, paginación y exportación CSV.','Detección de ejecuciones demoradas.','Localización español/inglés.','Validación offline de licencias firmadas para ediciones comerciales.'])
          d.add_heading('Arquitectura',1); d.add_paragraph('Web/API + Worker Service + SQL Server. La instalación Windows estándar ejecuta Web y Worker como servicios de Windows y mantiene la base de monitoreo dentro del entorno del cliente.')
          d.add_heading('Demo 1.1.2',1); add_bullets(d,['Evaluación por 30 días.','Hasta 3 procesos.','1 Worker/integración.','Procesamiento local y dashboard reales.','Acceso de solo lectura después del vencimiento.','CSV de ejemplo reutilizable incluido.'])
          d.add_heading('Professional y Enterprise',1); d.add_paragraph('Las ediciones comerciales utilizan el mismo núcleo de monitoreo con límites licenciados y configuración de producción. Los paquetes se generan por separado con licencias firmadas específicas para cada cliente.')
          d.add_heading('Base de seguridad',1); add_bullets(d,['Binding Web predeterminado solo en loopback.','API key aleatoria generada durante la instalación.','Credenciales de administrador almacenadas con PBKDF2-SHA-256.','Rate limiting y headers defensivos.','Acceso SQL parametrizado y stored procedures.','La clave privada de firma no se distribuye con el producto.'])
          d.add_heading('Distribución 1.1.2',1); d.add_paragraph('La Demo pública se distribuye como ZIP Windows x64 con checksum SHA-256. La versión 1.1.2 incluye el instalador/desinstalador gráfico validado y la identidad visual actual de Workflow Monitor.')
          save(d,'SqlWorkflowMonitor_Descripcion_Comercial_ES_1.1.2.docx')

          # English product overview
          d = base_doc('Workflow Monitor','Product Overview','Version 1.1.2 · September 2026','en')
          d.add_heading('Operational visibility for backend workflows',1); d.add_paragraph('Workflow Monitor is an on-premises Windows application for recording and reviewing the lifecycle of .NET backend processes, Worker Services, imports, batch jobs and SQL-backed workflows from an authenticated web dashboard.')
          d.add_heading('Core capabilities',1); add_bullets(d,['Execution lifecycle REST API.','Authenticated Web dashboard.','SQL Server persistence.','Worker Service integration.','Processing totals, success/failure metrics and affected rows.','Filtering, sorting, pagination and CSV export.','Stale execution detection.','Spanish and English localization.','Offline signed-license validation for commercial editions.'])
          d.add_heading('Architecture',1); d.add_paragraph('Web/API + Worker Service + SQL Server. The standard Windows deployment runs Web and Worker as Windows services and keeps the monitoring database in the customer environment.')
          d.add_heading('Demo 1.1.2',1); add_bullets(d,['30-day evaluation.','Up to 3 processes.','1 Worker/integration.','Real local processing and dashboard.','Read-only access after expiration.','Reusable CSV sample included.'])
          d.add_heading('Professional and Enterprise',1); d.add_paragraph('Commercial editions use the same monitoring core with licensed limits and production deployment settings. Packages are generated separately with customer-specific signed licenses.')
          d.add_heading('Security baseline',1); add_bullets(d,['Loopback-only default Web binding.','Random API key generated during installation.','PBKDF2-SHA-256 administrator credential storage.','Rate limiting and defensive web headers.','Parameterized SQL access and stored procedures.','No private signing key is distributed with the product.'])
          d.add_heading('Version 1.1.2 distribution',1); d.add_paragraph('The public Demo is distributed as a Windows x64 ZIP with a SHA-256 checksum. Version 1.1.2 includes the validated graphical installer/uninstaller and current Workflow Monitor branding.')
          save(d,'SqlWorkflowMonitor_Product_Overview_EN_1.1.2.docx')
          PY
          python "$RUNNER_TEMP/build_docs.py"

      - name: Validate generated files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          expected = [
            'SqlWorkflowMonitor_Manual_de_Instalacion_y_Uso_ES_1.1.2.docx',
            'SqlWorkflowMonitor_Installation_and_User_Guide_EN_1.1.2.docx',
            'SqlWorkflowMonitor_Descripcion_Comercial_ES_1.1.2.docx',
            'SqlWorkflowMonitor_Product_Overview_EN_1.1.2.docx',
          ]
          for name in expected:
              p = Path('docs') / name
              if not p.exists() or p.stat().st_size < 10000:
                  raise SystemExit(f'Invalid generated document: {name}')
              with ZipFile(p) as z:
                  names = z.namelist()
                  if 'word/document.xml' not in names:
                      raise SystemExit(f'Invalid DOCX structure: {name}')
                  if not any(x.startswith('word/media/') for x in names):
                      raise SystemExit(f'Logo/media missing: {name}')
                  core = z.read('docProps/core.xml').decode('utf-8', 'ignore')
                  if 'Federico' in core or 'stimpfldev@gmail.com' in core:
                      raise SystemExit(f'Personal metadata found: {name}')
          print('All four public DOCX files validated.')
          PY

      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.docx
          if git diff --cached --quiet; then
            echo "Documentation already current."
          else
            git commit -m "docs: publish Workflow Monitor 1.1.2 Word documentation"
            git push
          fi
