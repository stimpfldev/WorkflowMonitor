name: Publish 1.1.3 assets temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-assets-1.1.3-temp.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify validated release package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-171c-820e-9fd2-e173d9808b3a/raw?se=2026-09-05T16%3A26%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=2e7ba409-017b-55ac-a679-f2a4ef64bccf&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T13%3A30%3A13Z&ske=2026-09-06T13%3A30%3A13Z&sks=b&skv=2026-02-06&sig=zmRGHORLOfRZ1WVAQJTdL6oxqnleI6C9QYPruRZVViE%3D' -o /tmp/release-artifact.zip
          rm -rf /tmp/release-files
          mkdir -p /tmp/release-files
          unzip -q /tmp/release-artifact.zip -d /tmp/release-files
          cd /tmp/release-files
          sha256sum -c SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip.sha256.txt

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Federico Stimpfl"
          git config user.email "contacto@federicostimpfl.com.ar"
          git rm .github/workflows/publish-assets-1.1.3-temp.yml
          git commit -m "chore: remove temporary 1.1.3 asset workflow"
          git push origin main

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.1.3 \
            /tmp/release-files/SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip \
            /tmp/release-files/SqlWorkflowMonitor-1.1.3-Demo-win-x64.zip.sha256.txt \
            --repo stimpfldev/WorkflowMonitor \
            --clobber
          gh release edit v1.1.3 \
            --repo stimpfldev/WorkflowMonitor \
            --target main \
            --draft=false \
            --latest
