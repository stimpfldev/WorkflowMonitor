name: Rewrite public commit email temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rewrite-email-temp.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite old email addresses in all branches and tags
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail

          # Materialize every remote branch locally so all public branch history is rewritten.
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            if [ "$branch" = "HEAD" ] || [ "$branch" = "main" ]; then
              continue
            fi
            git branch -f "$branch" "$ref"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)

          git filter-branch -f --env-filter '
          NEW_EMAIL="contacto@federicostimpfl.com.ar"
          case "$GIT_AUTHOR_EMAIL" in
            stimpfldev@gmail.com|federicosdev@gmail.com)
              export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
              ;;
          esac
          case "$GIT_COMMITTER_EMAIL" in
            stimpfldev@gmail.com|federicosdev@gmail.com)
              export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
              ;;
          esac
          ' --tag-name-filter cat -- --branches --tags

          rm -rf .git/refs/original/

          if git log --branches --tags --format='%ae%n%ce' | grep -E '^(stimpfldev@gmail\.com|federicosdev@gmail\.com)$'; then
            echo 'Old email still present in rewritten public branch/tag history.' >&2
            exit 1
          fi

      - name: Remove temporary workflow and push rewritten history
        shell: bash
        run: |
          set -euo pipefail

          git checkout main
          git config user.name "Federico Stimpfl"
          git config user.email "contacto@federicostimpfl.com.ar"

          git rm .github/workflows/rewrite-email-temp.yml
          git commit -m "chore: remove temporary history rewrite workflow"

          if git log --branches --tags --format='%ae%n%ce' | grep -E '^(stimpfldev@gmail\.com|federicosdev@gmail\.com)$'; then
            echo 'Old email still present before push.' >&2
            exit 1
          fi

          git push origin --force --all
          git push origin --force --tags
